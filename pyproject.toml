[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mlserve-ops"
version = "0.1.0"
description = "Self-provisioning model service with a reproducible benchmark harness"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "prometheus-client>=0.21",
    "numpy>=1.26",
    "pandas>=2.2",
    "matplotlib>=3.9",
    "PyYAML>=6.0",
    "torch>=2.4",
    "onnx>=1.17",
    "onnxruntime>=1.19",
    "scikit-learn>=1.5",
    "scipy>=1.11,<1.17",
    "sqlalchemy>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "httpx>=0.27",
    "ruff>=0.7",
]
postgres = ["psycopg[binary]>=3.2"]

[project.scripts]
mlserve-serve = "mlserve.server:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "C4", "SIM"]
ignore = [
    "E501",  # line length is handled by the formatter, not the linter
    "B008",  # FastAPI Depends() in defaults is the documented pattern
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "slow: takes more than a few seconds (deselect with -m 'not slow')",
    "docker: needs a running docker daemon",
]

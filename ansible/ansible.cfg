# ansible.cfg
#
# ssh pipelining cuts one round trip per task, which on a first run over a slow
# link is the difference between minutes and tens of minutes.
[defaults]
inventory = inventory.ini
host_key_checking = False
retry_files_enabled = False
pipelining = True
stdout_callback = yaml
interpreter_python = auto_silent
# Facts are cached briefly so repeated runs during development do not re-gather.
gathering = smart
fact_caching = jsonfile
fact_caching_connection = .ansible_facts
fact_caching_timeout = 3600

[privilege_escalation]
become = True
become_method = sudo
become_ask_pass = False

[ssh_connection]
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o StrictHostKeyChecking=no

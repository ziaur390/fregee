# Inventory.
#
# `local` targets this machine and exists so `--syntax-check` and `--check` can be
# run without a VM. A full apply against localhost requires root and will change
# this machine - which is why it is a separate group rather than the default.
#
# `mlserve` is the group the VM path uses. Terraform prints the exact
# `-i` line to use once it has created the host.

[local]
localhost ansible_connection=local

[mlserve]
# Populated by terraform/envs/*/outputs.tf. Example:
# mlserve-vm ansible_host=192.168.64.7 ansible_user=ubuntu ansible_ssh_private_key_file=~/.ssh/id_ed25519

[mlserve:vars]
ansible_python_interpreter=/usr/bin/python3
ansible_ssh_common_args=-o StrictHostKeyChecking=accept-new -o ConnectTimeout=10

[all:vars]
ansible_user=ubuntu

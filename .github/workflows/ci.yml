name: ci

# Runs on every push and pull request. Everything here also runs locally via
# `python tasks.py <target>` — CI is not the only place these commands work, which
# is the whole point. A pipeline that can only be exercised by pushing is a
# pipeline nobody can debug.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # One thread each. The benchmark and the tests compare runtimes, so the number of
  # cores the runner happens to have must not be a variable in the measurement.
  OMP_NUM_THREADS: "1"
  MLSERVE_TORCH_THREADS: "1"
  PYTHONUNBUFFERED: "1"
  # Reproducibility: without this, Python randomises string hashing per process and
  # anything relying on dict ordering or hash() varies between runs.
  PYTHONHASHSEED: "1337"

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dev tooling
        run: pip install "ruff>=0.7" pyyaml
      - name: Ruff lint
        run: ruff check src tests tasks.py
      - name: Ruff format check
        run: ruff format --check src tests tasks.py
      - name: Validate YAML and JSON configuration
        run: |
          python - <<'PY'
          import json, sys, pathlib, yaml
          bad = []
          for path in pathlib.Path(".").rglob("*.y*ml"):
              if ".git" in path.parts or ".venv" in path.parts:
                  continue
              try:
                  list(yaml.safe_load_all(path.read_text(encoding="utf-8")))
              except Exception as exc:
                  bad.append(f"{path}: {exc}")
          for path in pathlib.Path(".").rglob("*.json"):
              if ".git" in path.parts:
                  continue
              try:
                  json.loads(path.read_text(encoding="utf-8"))
              except Exception as exc:
                  bad.append(f"{path}: {exc}")
          if bad:
              print("\n".join(bad)); sys.exit(1)
          print("all YAML and JSON parse")
          PY

  test:
    name: test (py${{ matrix.python }})
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          # Torch from the CPU index, or the CUDA wheel drags in 2.5 GB.
          pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.4"
          pip install -e ".[dev]"

      - name: Build models and drift reference
        run: python tasks.py pipeline

      - name: Run tests
        run: python -m pytest tests -m "not docker" --cov=mlserve --cov-report=term-missing -q

      - name: Assert the metrics documented in the alert rules exist
        # Belt and braces on top of test_monitoring.py: if that test were ever
        # skipped, this still catches an alert rule naming a metric nobody exposes.
        run: |
          python - <<'PY'
          import re, sys, yaml, pathlib
          import urllib.request
          from prometheus_client import generate_latest
          import mlserve.app  # registers the collectors
          exposed = set(re.findall(r"^# TYPE (mlserve_\w+)", generate_latest().decode(), re.M))
          llm = {"mlserve_drift_psi_max","mlserve_drift_psi_mean","mlserve_drift_features_watched",
                 "mlserve_drift_features_alerted","mlserve_drift_fraction_watched",
                 "mlserve_drift_requests","mlserve_drift_alert","mlserve_drift_last_run_unixtime"}
          known = exposed | llm
          rules = yaml.safe_load(pathlib.Path("monitoring/prometheus/alerts.yml").read_text())
          missing = []
          for group in rules["groups"]:
              for rule in group["rules"]:
                  for metric in set(re.findall(r"\b(mlserve_\w+)\b", str(rule.get("expr","")))):
                      base = re.sub(r"_(bucket|sum|count|created|total)$", "", metric)
                      if metric not in known and base not in known and f"{base}_total" not in known:
                          missing.append(f"{rule.get('alert') or rule.get('record')}: {metric}")
          if missing:
              print("alert rules reference unknown metrics:"); print("\n".join(missing)); sys.exit(1)
          print(f"all alert metrics resolve ({len(known)} known)")
          PY

      - name: Upload coverage
        if: matrix.python == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml
          if-no-files-found: ignore

  benchmark:
    name: benchmark
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.4"
          pip install -e ".[dev]"
      - name: Build artefacts
        run: python tasks.py pipeline
      - name: Run the benchmark matrix
        # Reduced size for CI: 15 calls x 2 repeats is enough to prove the harness
        # runs end to end. It is NOT enough for a p95, and the report will say so —
        # which is the point of the tail-power table.
        env:
          MLSERVE_BENCH_CALLS: "15"
          MLSERVE_BENCH_REPEATS: "2"
        run: python tasks.py bench
      - name: Generate the report
        run: python tasks.py report
      - name: Run drift detection
        run: python tasks.py drift || true   # exit code 2 means an alert was found, not a failure
      - name: Backup and verify the restore
        run: |
          python tasks.py backup
          python tasks.py restore-verify
      - name: Upload benchmark artefacts
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-${{ github.sha }}
          path: |
            results/raw.csv
            results/REPORT.md
            results/accuracy.csv
            results/coldstart.csv
            results/run_meta.json
            results/*.png
          if-no-files-found: error

  docker:
    name: docker build and compose smoke
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build the image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: mlserve-ops:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Bring the stack up
        run: docker compose up -d --wait --wait-timeout 600
      - name: Run the smoke test
        run: |
          pip install httpx
          python tasks.py smoke
      - name: Check Prometheus sees the API as UP
        run: |
          for i in $(seq 1 20); do
            if curl -fsS http://localhost:9090/api/v1/targets \
               | grep -q '"job":"mlserve-api"'; then
              echo "target present"; exit 0
            fi
            sleep 3
          done
          echo "target missing"; exit 1
      - name: Dump logs on failure
        if: failure()
        run: docker compose logs --tail 200
      - name: Tear down
        if: always()
        run: docker compose down -v

  infra:
    name: infrastructure config
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ---------------------------------------------------------------- ansible
      - name: Install Ansible and ansible-lint
        # Floor, not an exact pin. ansible-lint 26 enforces var-naming[role-prefix] at
        # the production profile; the 6.17 release available from Ubuntu's archive
        # does not, and that gap let eleven violations reach CI unnoticed. Stating a
        # floor keeps the modern rules active while Dependabot handles the bumps.
        run: pip install "ansible-core>=2.16" "ansible-lint>=26.0"

      - name: Install the collections the playbook declares
        # This step is the point. ansible-core ships only ansible.builtin; the
        # playbook uses community.general.ufw and ansible.posix.sysctl, so without
        # this a pip-installed Ansible fails at those tasks with an unresolvable
        # module. The requirements file was missing until ansible-lint surfaced it.
        run: ansible-galaxy collection install -r ansible/requirements.yml

      - name: ansible-playbook --syntax-check
        working-directory: ansible
        run: ansible-playbook --syntax-check playbook.yml

      - name: ansible-lint (production profile)
        working-directory: ansible
        run: ansible-lint --nocolor playbook.yml

      - name: Assert the whole task graph resolves
        working-directory: ansible
        # --syntax-check proves the playbook parses; --list-tasks additionally proves
        # every role loads and every task is reachable. A role whose tasks/main.yml
        # is missing parses fine and does nothing at all.
        run: |
          count=$(ansible-playbook --list-tasks playbook.yml 2>/dev/null | grep -cE '^\s+\S.*TAGS:')
          echo "resolved $count tasks"
          if [ "$count" -lt 40 ]; then
            echo "expected at least 40 tasks across the six roles, got $count"; exit 1
          fi

      # ---------------------------------------------------------------- terraform
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.16.2"

      - name: terraform fmt -check
        run: terraform fmt -check -recursive terraform/

      - name: terraform validate (local env)
        working-directory: terraform/envs/local
        run: |
          terraform init -input=false -backend=false
          terraform validate

      - name: terraform validate (free-tier env)
        working-directory: terraform/envs/free-tier
        # `-backend=false` still downloads providers, which is what makes this a
        # real schema check: it validates the OCI resources, security lists and
        # dynamic blocks against the actual provider rather than against a guess.
        run: |
          terraform init -input=false -backend=false
          terraform validate

  compose-validate:
    name: docker compose config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Catches a malformed compose file without paying for an image build.
      - run: docker compose config --quiet

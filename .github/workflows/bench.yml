name: bench

# The full benchmark on a tag, and on demand.
#
# Separate from ci.yml because it is the artefact-producing run rather than the
# gate: ci.yml runs a reduced matrix to prove the harness works, this runs the real
# one and attaches the report to a release.
#
# Tagging is the trigger because the results are only comparable within a single
# configuration. Attaching them to a release means the numbers and the commit they
# describe travel together, and run_meta.json records the config hash that produced
# them.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      calls_per_repeat:
        description: "Calls per cell. 70 gives 210 observations/cell, which is the minimum for a powered p95."
        required: false
        default: "70"
      repeats:
        description: "Independent trials per cell."
        required: false
        default: "3"

permissions:
  contents: write

env:
  OMP_NUM_THREADS: "1"
  MLSERVE_TORCH_THREADS: "1"
  PYTHONHASHSEED: "1337"
  PYTHONUNBUFFERED: "1"

jobs:
  bench:
    name: full benchmark matrix
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.4"
          pip install -e ".[dev]"

      - name: Record the runner's CPU
        # Every timing number is a property of this machine as much as of the code.
        # Recording it is what lets someone judge whether the results are
        # comparable to theirs.
        run: |
          echo "CPU: $(grep -m1 'model name' /proc/cpuinfo | cut -d: -f2 | xargs)"
          echo "Cores: $(nproc)"
          echo "Runner: $RUNNER_NAME ($RUNNER_OS)"

      - name: Build artefacts
        run: python tasks.py pipeline

      - name: Verify runtime parity before measuring anything
        # A benchmark whose three runtimes disagree on labels is measuring nothing.
        # export.py asserts this and exits non-zero, so this step is the guard.
        run: python tasks.py export

      - name: Run the full benchmark
        env:
          MLSERVE_BENCH_CALLS: ${{ github.event.inputs.calls_per_repeat || '70' }}
          MLSERVE_BENCH_REPEATS: ${{ github.event.inputs.repeats || '3' }}
        run: python tasks.py bench

      - name: Generate the report
        run: python tasks.py report

      - name: Show the report head in the log
        run: head -60 results/REPORT.md

      - name: Check the report has no unfilled numbers
        # Guards against a report that renders "nan" where a measurement should be.
        run: |
          if grep -nE '\| *(nan|NaN|inf) ' results/REPORT.md; then
            echo "REPORT.md contains non-numeric cells"; exit 1
          fi
          echo "no non-numeric cells in the report tables"

      - name: Upload the benchmark artefacts
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-${{ github.ref_name }}-${{ github.run_id }}
          path: |
            results/raw.csv
            results/REPORT.md
            results/accuracy.csv
            results/coldstart.csv
            results/run_meta.json
            results/drift.json
            results/*.png
          if-no-files-found: error
          retention-days: 90

      - name: Attach the report to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            results/REPORT.md
            results/raw.csv
            results/run_meta.json
            results/*.png
          body: |
            ## Benchmark run for ${{ github.ref_name }}

            Generated by `python tasks.py bench && python tasks.py report` on
            `ubuntu-latest`. Every number in `REPORT.md` came from `raw.csv`; nothing
            was entered by hand.

            Reproduce with:

            ```bash
            python tasks.py install
            python tasks.py pipeline
            python tasks.py bench
            python tasks.py report
            ```

            The **Interpretation** section of the report is intentionally empty.
            The harness writes the numbers; the conclusions are a person's to draw.

      - name: Summarise in the job output
        if: always()
        run: |
          {
            echo "### Benchmark complete"
            echo
            echo "Config hash and seed are recorded in results/run_meta.json."
            echo "Every figure carries a 95% bootstrap interval."
            echo
            sed -n '/^## 1\. Latency/,/^### Tail power/p' results/REPORT.md | head -25
          } >> "$GITHUB_STEP_SUMMARY"
